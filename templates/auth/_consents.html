{# Consent check-boxes. None is pre-ticked. Required ones are marked as such. #}
{% macro terms(form) %}
<div class="form-check mb-2">
  <input class="form-check-input" type="checkbox" id="accept_terms" name="accept_terms" required {{ 'checked' if form.get('accept_terms') }}>
  <label class="form-check-label" for="accept_terms">I have read and accept the <a href="{{ url_for('legal.terms') }}" target="_blank" rel="noopener">Terms of Service</a> and <a href="{{ url_for('legal.privacy_policy') }}" target="_blank" rel="noopener">Privacy Policy</a>. <span class="text-muted">(required)</span></label>
</div>
{% endmacro %}

{% macro adult(form) %}
<div class="form-check mb-2">
  <input class="form-check-input" type="checkbox" id="confirm_adult" name="confirm_adult" required {{ 'checked' if form.get('confirm_adult') }}>
  <label class="form-check-label" for="confirm_adult">I confirm that I am {{ min_age }} years old or older. <span class="text-muted">(required)</span></label>
</div>
{% endmacro %}
